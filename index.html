<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>O.A.C. · Serena Energia</title>
<meta name="theme-color" content="#FF5246">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --coral:#FF5246; --coral-soft:#FFE3E0; --grafite:#4B4B4B; --areia:#EDE9E5;
    --white:#FFFFFF; --dark:#181818; --verde:#32CAA0; --verde-soft:#DEF6ED;
    --border:#E2DDD6; --muted:#928D88; --amber:#F2A93B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--areia);font-family:'Poppins',-apple-system,Segoe UI,Roboto,sans-serif;color:var(--dark);}
  #app{max-width:680px;margin:0 auto;padding:12px 12px 110px;}
  .icon{display:inline-block;vertical-align:middle;line-height:0;}
  .icon svg{display:block;}

  .header{background:var(--coral);border-radius:18px;padding:14px 16px;margin-bottom:12px;display:flex;flex-direction:column;}
  .header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .header-logo-btn{background:none;border:none;padding:0;cursor:pointer;display:flex;align-items:center;}
  .header-logo{height:20px;width:auto;display:block;}
  .header-title{color:var(--white);font-weight:800;font-size:18px;line-height:1.1;}
  .header-sub{color:rgba(255,255,255,.85);font-weight:500;font-size:10.5px;margin-top:2px;}

  .coach-icon-btn{background:rgba(255,255,255,.18);border:none;border-radius:10px;padding:7px;color:var(--white);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s;}
  .coach-icon-btn:hover{background:rgba(255,255,255,.34);}
  .coach-modal-overlay{position:fixed;inset:0;background:rgba(24,24,24,.55);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;}
  .coach-modal{background:var(--white);border-radius:18px;max-width:460px;width:100%;max-height:82vh;overflow-y:auto;}
  .coach-modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 12px;position:sticky;top:0;background:var(--white);border-bottom:1px solid var(--border);}
  .coach-modal-close{background:var(--areia);border:none;border-radius:8px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--grafite);cursor:pointer;flex-shrink:0;}
  .coach-modal-close:hover{background:var(--border);}
  .coach-modal-body{padding:6px 16px 18px;}

  .tabs{display:flex;background:var(--white);border:1px solid var(--border);border-radius:16px;padding:4px;margin-bottom:16px;gap:4px;}
  .tab-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border:none;border-radius:12px;font-weight:700;font-size:13px;font-family:inherit;cursor:pointer;background:transparent;color:var(--grafite);transition:.15s;}
  .tab-btn.active{background:var(--dark);color:var(--white);}

  .card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  label.field{display:block;}
  .field-label{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--grafite);margin-bottom:5px;}
  .input, textarea.input{width:100%;padding:8px 10px;border-radius:8px;border:1.5px solid var(--border);font-size:13.5px;font-family:inherit;color:var(--dark);outline:none;background:var(--white);}
  .input:focus, textarea.input:focus{border-color:var(--coral);}
  textarea.input{resize:none;min-height:60px;}

  .activity-row{display:flex;gap:8px;margin-top:6px;}
  .activity-btn{flex:1;padding:9px;border-radius:10px;border:none;font-family:inherit;font-weight:600;font-size:13px;cursor:pointer;background:var(--areia);color:var(--grafite);}
  .activity-btn.active{background:var(--coral);color:var(--white);}

  .progress-card{background:var(--dark);border-radius:16px;padding:14px 16px;margin-bottom:14px;}
  .progress-top{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--white);margin-bottom:7px;}
  .progress-track{height:8px;border-radius:8px;background:rgba(255,255,255,.15);overflow:hidden;}
  .progress-fill{height:100%;border-radius:8px;background:var(--verde);transition:width .25s;}

  .section{border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:10px;}
  .section-head{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--white);border:none;cursor:pointer;font-family:inherit;text-align:left;}
  .section-head.complete{background:var(--verde-soft);}
  .section-badge{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--white);background:var(--grafite);flex-shrink:0;}
  .section-badge.complete{background:var(--verde);}
  .section-title{font-size:14px;font-weight:700;color:var(--dark);}
  .section-sub{font-size:11.5px;color:var(--muted);margin-top:1px;}
  .section-chevron{margin-left:auto;color:var(--grafite);transition:transform .2s;flex-shrink:0;}
  .section-chevron.open{transform:rotate(180deg);}
  .section-body{padding:0 16px 16px;background:var(--white);}

  .item-card{background:var(--areia);border-radius:12px;padding:12px;margin-top:10px;}
  .item-head{display:flex;gap:8px;margin-bottom:8px;}
  .item-id{color:var(--coral);font-weight:700;font-size:12px;flex-shrink:0;}
  .item-text{font-size:13px;color:var(--dark);}

  .seg{display:flex;border-radius:8px;overflow:hidden;border:1.5px solid var(--border);}
  .seg-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 4px;font-size:13px;font-weight:600;font-family:inherit;border:none;cursor:pointer;background:var(--white);color:#9A9591;border-right:1.5px solid var(--border);}
  .seg-btn:last-child{border-right:none;}
  .seg-btn.sim.active{background:var(--verde);color:var(--white);}
  .seg-btn.nao.active{background:var(--coral);color:var(--white);}
  .seg-btn.na.active{background:var(--grafite);color:var(--white);}

  .detail{margin-top:10px;}
  .p-label{font-size:11px;font-weight:700;color:var(--grafite);margin-bottom:5px;display:block;}
  .p-row{display:flex;gap:8px;margin-bottom:8px;}
  .p-btn{flex:1;padding:7px;border-radius:8px;font-weight:700;font-size:12.5px;font-family:inherit;cursor:pointer;background:var(--white);color:var(--grafite);border:1.5px solid var(--border);}
  .p-btn.active{background:var(--coral);color:var(--white);border-color:var(--coral);}

  .chip-group{margin-bottom:12px;}
  .chip-cat{font-size:11px;font-weight:700;color:var(--grafite);margin-bottom:6px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{padding:6px 11px;border-radius:999px;font-size:12px;font-weight:500;font-family:inherit;border:none;cursor:pointer;background:var(--areia);color:var(--grafite);}
  .chip.active{background:var(--coral);color:var(--white);}

  .save-bar{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--border);padding:12px;display:flex;justify-content:center;}
  .save-bar-inner{max-width:680px;width:100%;}
  .save-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border:none;border-radius:12px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;background:var(--coral);color:var(--white);}
  .save-btn.saved{background:var(--verde);}
  .save-btn:disabled{background:var(--areia);color:var(--muted);cursor:not-allowed;}

  .kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .kpi-card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:14px;}
  .kpi-label{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.02em;color:var(--muted);margin-bottom:6px;}
  .kpi-value{font-size:22px;font-weight:800;color:var(--dark);}

  .top-card{display:flex;flex-wrap:wrap;align-items:center;gap:16px;}
  .charts-grid{display:grid;grid-template-columns:1fr;gap:14px;}
  @media(min-width:600px){ .charts-grid{grid-template-columns:1fr 1fr;} }
  .section-group-title{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--coral);margin:22px 2px 8px;display:flex;align-items:center;gap:8px;}
  .section-group-title::after{content:"";flex:1;height:1px;background:var(--border);}
  .chart-title{font-size:13px;font-weight:700;color:var(--dark);margin-bottom:10px;}

  .bar-row{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
  .bar-name{width:128px;font-size:11px;color:var(--grafite);flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bar-track{flex:1;height:14px;border-radius:7px;background:var(--areia);overflow:hidden;}
  .bar-fill{height:100%;border-radius:7px;}
  .bar-pct{width:38px;text-align:right;font-size:11.5px;font-weight:700;color:var(--dark);flex-shrink:0;}

  .rank-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
  .rank-loc{width:110px;font-size:12.5px;font-weight:500;color:var(--grafite);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0;}
  .rank-track{flex:1;height:10px;border-radius:6px;background:var(--areia);overflow:hidden;}
  .rank-fill{height:100%;border-radius:6px;}
  .rank-pct{width:40px;text-align:right;font-size:12.5px;font-weight:700;color:var(--dark);flex-shrink:0;}

  .crit-item{background:var(--coral-soft);border-radius:12px;padding:11px;margin-bottom:8px;}
  .crit-top{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--coral);margin-bottom:4px;}
  .crit-text{font-size:12.5px;font-weight:500;color:var(--dark);}
  .crit-obs{font-size:12px;margin-top:4px;font-style:italic;color:var(--grafite);}

  .empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;padding:70px 20px;}
  .empty-icon{width:60px;height:60px;border-radius:50%;background:var(--areia);display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
  .empty-title{font-size:15px;font-weight:700;color:var(--dark);margin-bottom:4px;}
  .empty-sub{font-size:13px;color:var(--muted);}

  .io-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .io-btn{flex:1 1 100px;display:flex;align-items:center;justify-content:center;gap:7px;padding:11px;border-radius:12px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;border:none;transition:.15s;white-space:nowrap;}
  .io-btn.export{background:var(--areia);color:var(--grafite);}
  .io-btn.export:hover{background:var(--border);}
  .io-btn.import{background:var(--dark);color:var(--white);}
  .io-btn.import:hover{background:var(--grafite);}
  .io-btn.sync{background:var(--verde-soft);color:#127A5B;}
  .io-btn.sync:hover{background:#c9efe1;}
  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--dark);color:var(--white);padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:999;pointer-events:none;transition:opacity .3s;white-space:nowrap;}
  .toast.hidden{opacity:0;}

  @media(max-width:480px){ .grid2{grid-template-columns:1fr;} .top-card{flex-direction:column;} }

  /* ---- Relatório PDF (impressão) ---- */
  .print-report{display:none;}
  .pdf-header{display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--coral);padding-bottom:12px;margin-bottom:16px;}
  .pdf-logo{height:26px;width:auto;}
  .pdf-title{font-size:18px;font-weight:800;color:var(--dark);text-align:right;}
  .pdf-subtitle{font-size:11px;color:var(--grafite);text-align:right;}
  .pdf-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;margin-bottom:16px;font-size:11.5px;}
  .pdf-meta div span.lbl{color:var(--muted);font-weight:700;text-transform:uppercase;font-size:9.5px;display:block;}
  .pdf-kpis{display:flex;gap:14px;margin-bottom:18px;padding:10px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);}
  .pdf-kpi{font-size:11.5px;color:var(--grafite);}
  .pdf-kpi b{font-size:15px;color:var(--dark);display:block;}
  .pdf-section-title{font-size:13px;font-weight:800;color:var(--coral);margin:16px 0 6px;border-bottom:1px solid var(--border);padding-bottom:3px;}
  .pdf-item{display:flex;gap:8px;font-size:11px;padding:3px 0;border-bottom:1px dotted var(--border);}
  .pdf-item .pdf-ic{width:14px;flex-shrink:0;font-weight:800;}
  .pdf-item.sim .pdf-ic{color:var(--verde);}
  .pdf-item.nao .pdf-ic{color:var(--coral);}
  .pdf-item.na .pdf-ic{color:var(--muted);}
  .pdf-item-detail{font-size:10px;color:var(--grafite);margin-left:22px;margin-top:1px;font-style:italic;}
  .pdf-feedback{font-size:11.5px;color:var(--grafite);border:1px solid var(--border);border-radius:6px;padding:10px;margin-top:8px;}
  .pdf-footer{margin-top:24px;padding-top:10px;border-top:1px solid var(--border);font-size:9px;color:var(--muted);text-align:center;}

  @media print{
    body > *:not(.print-report){ display:none !important; }
    .print-report{ display:block !important; }
    body{ background:#fff; }
    @page{ size:A4; margin:14mm; }
  }

  /* ---- Capa / tela inicial ---- */
  .cover-screen{border-radius:22px;overflow:hidden;background:var(--areia);box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .cover-hero{position:relative;width:100%;height:240px;overflow:hidden;background:var(--areia);}
  .cover-hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 58%;animation:coverZoom 24s ease-in-out infinite alternate;}
  @keyframes coverZoom{from{transform:scale(1);} to{transform:scale(1.09);}}
  .cover-hero-fade{position:absolute;inset:0;background:linear-gradient(180deg, rgba(237,233,229,0) 45%, rgba(237,233,229,.55) 78%, var(--areia) 98%);}
  .cover-hero-badge{position:absolute;top:14px;left:14px;background:rgba(24,24,24,.38);backdrop-filter:blur(2px);border-radius:10px;padding:6px 10px;display:flex;align-items:center;gap:6px;}
  .cover-hero-badge img{height:14px;width:auto;display:block;}
  .cover-content{padding:8px 26px 32px;display:flex;flex-direction:column;align-items:center;text-align:center;}
  .cover-logo{height:44px;width:auto;margin-bottom:20px;}
  .cover-app-title{font-size:32px;font-weight:800;color:var(--dark);letter-spacing:.01em;line-height:1;}
  .cover-app-sub{font-size:12.5px;font-weight:500;color:var(--grafite);margin-top:8px;margin-bottom:28px;max-width:290px;line-height:1.5;}
  .cover-buttons{display:flex;flex-direction:column;gap:12px;width:100%;max-width:360px;}
  .cover-btn{display:flex;align-items:center;justify-content:center;gap:9px;padding:16px;border-radius:14px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;border:none;transition:.15s;}
  .cover-btn.primary{background:var(--coral);color:var(--white);box-shadow:0 10px 20px rgba(255,82,70,.30);}
  .cover-btn.primary:hover{background:#EF463B;}
  .cover-btn.secondary{background:var(--white);color:var(--dark);border:1.5px solid var(--border);}
  .cover-btn.secondary:hover{background:var(--white);border-color:var(--coral);color:var(--coral);}
  .cover-panel-link{margin-top:18px;background:none;border:none;font-family:inherit;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:2px;}
  .cover-panel-link:hover{color:var(--grafite);}
  .cover-footer{margin-top:26px;font-size:9.5px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;}
</style>
</head>
<body>
<div id="app"></div>
<div id="print-report" class="print-report"></div>

/* =========================================================
   Resumo do checklist — gera campos "planos" (qtdSim, qtdNao,
   qtdNA, conformidade, qtdNaoConformidades) que viram COLUNAS na
   planilha do Excel. Assim é possível montar filtros, visões e
   Power BI sem precisar abrir o PayloadJSON.
========================================================= */
function resumoRespostas(form){
  let sim = 0, nao = 0, na = 0;
  ALL_ITEMS.forEach(it => {
    const r = (form.respostas || {})[it.id];
    if(!r || !r.resposta) return;
    if(r.resposta === "Sim") sim++;
    else if(r.resposta === "Não") nao++;
    else na++;
  });
  const conformidade = (sim + nao) === 0 ? 100 : Math.round((sim / (sim + nao)) * 100);
  return { qtdSim: sim, qtdNao: nao, qtdNA: na, qtdNaoConformidades: nao, conformidade };
}

/* =========================================================
   Sincronização de um registro com o backend central
========================================================= */
async function syncRecord(record){
  if(!SYNC_SAVE_URL) return { ok:false, error:"Sincronização não configurada." };
  try {
    const res = await fetch(SYNC_SAVE_URL, {
      method: "POST",
      // text/plain evita o preflight CORS (OPTIONS), que o endpoint do
      // Power Automate não responde. O Flow converte com json(string(triggerBody())).
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify(record),
    });
    if(!res.ok){
      const bodyText = await res.text().catch(() => "");
      const msg = `HTTP ${res.status}${bodyText ? " — " + bodyText.slice(0,160) : ""}`;
      console.error("[OAC] Falha ao sincronizar:", msg);
      return { ok:false, error: msg };
    }
    return { ok:true };
  } catch(e){
    const msg = (e && e.message) ? e.message : String(e);
    console.error("[OAC] Erro de rede ao sincronizar:", msg);
    return { ok:false, error: msg };
  }
}

function pendingSyncCount(){
  return state.records.filter(r => !r._synced).length;
}

async function syncPendingRecords(){
  if(!SYNC_SAVE_URL){ showToast("Sincronização ainda não configurada."); return; }
  const pendentes = state.records.filter(r => !r._synced);
  if(pendentes.length === 0){ showToast("Tudo já está sincronizado ✓"); return; }
  showToast(`Sincronizando ${pendentes.length} observação(ões)...`);
  let ok = 0; let lastError = "";
  for(const rec of pendentes){
    const result = await syncRecord(rec);
    if(result.ok){ rec._synced = true; ok++; } else { lastError = result.error || "Erro desconhecido"; }
  }
  saveRecords(state.records);
  state.lastSyncError = ok === pendentes.length ? "" : lastError;
  render();
  showToast(ok === pendentes.length ? `${ok} sincronizada(s) ✓` : `${ok}/${pendentes.length} sincronizada(s) — veja o detalhe do erro abaixo do botão`);
}

/* =========================================================
   Painel Geral (admin) — busca todos os registros do backend
========================================================= */
async function fetchAllRecords(){
  if(!SYNC_LIST_URL) throw new Error("SYNC_LIST_URL não configurada");
  let res;
  try {
    // POST com corpo vazio: o gatilho HTTP do Power Automate aceita POST por
    // padrão (não precisa configurar Método = GET) e text/plain evita o preflight.
    res = await fetch(SYNC_LIST_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: "{}",
    });
  } catch(networkErr){
    throw new Error(`Falha de rede — ${(networkErr && networkErr.message) || networkErr}`);
  }
  if(!res.ok){
    const bodyText = await res.text().catch(() => "");
    throw new Error(`HTTP ${res.status}${bodyText ? " — " + bodyText.slice(0,160) : ""}`);
  }
  let data;
  try {
    data = await res.json();
  } catch(parseErr){
    throw new Error("Resposta do robô não é um JSON válido.");
  }
  // Aceita: array direto, { value: [...] } (padrão SharePoint/Graph), itens como
  // string JSON crua, ou itens como objeto com campo PayloadJSON.
  const list = Array.isArray(data) ? data : (Array.isArray(data.value) ? data.value : []);
  return list.map(item => {
    if(typeof item === "string") return JSON.parse(item);
    if(item && typeof item.PayloadJSON === "string") return JSON.parse(item.PayloadJSON);
    return item;
  }).filter(Boolean);
}

/* =========================================================
   Exportar / Importar observações
========================================================= */
function exportRecords(){
  const records = loadRecords();
  if(!records.length){ showToast("Nenhuma observação para exportar."); return; }
  const date = new Date().toISOString().slice(0,10);
  const filename = `OAC_observacoes_${date}.json`;
  const blob = new Blob([JSON.stringify(records, null, 2)], { type:"application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
  showToast(`${records.length} observação(ões) exportada(s) ✓`);
}

function importRecords(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const incoming = JSON.parse(e.target.result);
      if(!Array.isArray(incoming)) throw new Error();
      const existing = loadRecords();
      const existingIds = new Set(existing.map(r => r.id));
      const novos = incoming.filter(r => r.id && !existingIds.has(r.id));
      if(novos.length === 0){ showToast("Nenhum registro novo encontrado."); return; }
      const merged = [...existing, ...novos].sort((a,b) => (a.createdAt||"").localeCompare(b.createdAt||""));
      saveRecords(merged);
      state.records = merged;
      showToast(`${novos.length} nova(s) observação(ões) importada(s) ✓`);
      state.tab = "dashboard";
      render();
    } catch(err){
      showToast("Arquivo inválido — use um JSON exportado do O.A.C.");
    }
  };
  reader.readAsText(file);
}

let toastTimer = null;
function showToast(msg){
  let el = document.getElementById("oac-toast");
  if(!el){
    el = document.createElement("div");
    el.id = "oac-toast";
    el.className = "toast hidden";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.remove("hidden");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add("hidden"), 2600);
}

function computeStats(records){
  let sim=0, nao=0, na=0, semAtivador=0;
  const bySection = {};
  SECTIONS.forEach(s => bySection[s.id] = { sim:0, nao:0, na:0, title:s.title });
  const naoConformidades = [];
  const byLocal = {};
  const byMonth = {};
  const byObservador = {};
  const byEmpresa = {};
  const atividadeCount = {}; ATIVIDADE_TIPOS.forEach(t => atividadeCount[t] = 0);
  const ativadorCount = {}; ATIVADOR_CATS.forEach(a => ativadorCount[a] = 0);
  let coachScoreSum = 0, coachScoreN = 0;
  let feedbacksCount = 0;

  records.forEach(rec => {
    let recSim=0, recNao=0;
    ALL_ITEMS.forEach(it => {
      const r = rec.respostas[it.id];
      if(!r || !r.resposta) return;
      if(r.resposta === "Sim"){ sim++; recSim++; bySection[it.sectionId].sim++; }
      else if(r.resposta === "Não"){
        nao++; recNao++; bySection[it.sectionId].nao++;
        if(r.ativadorCategoria && ativadorCount.hasOwnProperty(r.ativadorCategoria)) ativadorCount[r.ativadorCategoria]++;
        if(!r.ativador) semAtivador++;
        naoConformidades.push({ data: rec.dataRealizacao, local: rec.local || "—", item: it.text, obs: r.obs || "", ativador: r.ativador || null, categoria: r.ativadorCategoria || null });
      } else if(r.resposta === "NA"){ na++; bySection[it.sectionId].na++; }
    });
    const loc = rec.local || "Não informado";
    if(!byLocal[loc]) byLocal[loc] = { sim:0, nao:0 };
    byLocal[loc].sim += recSim; byLocal[loc].nao += recNao;

    const month = (rec.dataRealizacao || "").slice(0,7);
    if(month){
      if(!byMonth[month]) byMonth[month] = { sim:0, nao:0, total:0 };
      byMonth[month].sim += recSim; byMonth[month].nao += recNao; byMonth[month].total++;
    }

    // Observadores: um registro pode ter mais de um nome (separado por , ; ou /)
    const nomes = (rec.observadores || "").split(/[,;/]+/).map(n => n.trim()).filter(Boolean);
    if(nomes.length === 0){
      byObservador["Não identificado"] = (byObservador["Não identificado"] || 0) + 1;
    } else {
      nomes.forEach(n => { byObservador[n] = (byObservador[n] || 0) + 1; });
    }

    if(rec.empresa){
      byEmpresa[rec.empresa] = (byEmpresa[rec.empresa] || 0) + 1;
    }

    if(rec.atividadeTipo && atividadeCount.hasOwnProperty(rec.atividadeTipo)) atividadeCount[rec.atividadeTipo]++;

    if(rec.feedbacks && rec.feedbacks.trim()) feedbacksCount++;

    if(rec.coach){
      const vals = Object.values(rec.coach).filter(v => v);
      if(vals.length){
        const pts = vals.reduce((acc,v) => acc + (v==="Sim"?2:v==="Parcial"?1:0), 0);
        coachScoreSum += pts / (vals.length*2);
        coachScoreN++;
      }
    }
  });

  const conf = (s,n) => (s+n===0 ? 100 : Math.round((s/(s+n))*100));
  const overall = conf(sim, nao);
  const sectionChart = Object.values(bySection).map(s => ({ name: s.title, sim:s.sim, nao:s.nao, na:s.na, total:s.sim+s.nao+s.na, conformidade: conf(s.sim,s.nao) }));
  const monthChart = Object.entries(byMonth).sort(([a],[b]) => a.localeCompare(b)).slice(-6).map(([m,v]) => ({ mes:m, conformidade: conf(v.sim,v.nao), total:v.total }));
  const localRanking = Object.entries(byLocal).map(([loc,v]) => ({ loc, conformidade: conf(v.sim,v.nao), total: v.sim+v.nao })).sort((a,b) => a.conformidade - b.conformidade);
  const ativadorChart = ATIVADOR_CATS.map(a => ({ name:a, count: ativadorCount[a] })).sort((a,b) => b.count - a.count);
  const totalAtivadores = ativadorChart.reduce((s,a) => s + a.count, 0);
  const coachScore = coachScoreN ? Math.round((coachScoreSum/coachScoreN)*100) : null;
  const observadorChart = Object.entries(byObservador).map(([name,count]) => ({ name, count })).sort((a,b) => b.count - a.count).slice(0,10);
  const empresaChart = Object.entries(byEmpresa).map(([name,count]) => ({ name, count })).sort((a,b) => b.count - a.count);
  const empresasDistintas = Object.keys(byEmpresa).length;
  const observadoresDistintos = Object.keys(byObservador).filter(n => n !== "Não identificado").length;

  // Destaques executivos
  const piorLocal = localRanking.length ? localRanking[0] : null;
  const melhorLocal = localRanking.length ? localRanking[localRanking.length-1] : null;
  const topEmpresa = empresaChart.length ? empresaChart[0] : null;
  const topObservadorList = observadorChart.filter(o => o.name !== "Não identificado");
  const topObservador = topObservadorList.length ? topObservadorList[0] : null;
  const topAtivador = (totalAtivadores > 0) ? ativadorChart[0] : null;
  const trendDelta = monthChart.length >= 2 ? (monthChart[monthChart.length-1].conformidade - monthChart[monthChart.length-2].conformidade) : null;

  return { sim, nao, na, semAtivador, overall, sectionChart, monthChart, localRanking, naoConformidades, ativadorChart, totalAtivadores, coachScore, observadorChart, empresaChart, atividadeCount, empresasDistintas, observadoresDistintos, feedbacksCount, piorLocal, melhorLocal, topEmpresa, topObservador, topAtivador, trendDelta };
}

function barColor(pct){ return pct>=90 ? C.verde : pct>=70 ? C.amber : C.coral; }

function countBarsHtml(data, color){
  if(!data.length) return `<div style="text-align:center;padding:16px;font-size:12.5px;color:${C.muted}">Nenhum dado registrado ainda.</div>`;
  const max = Math.max(...data.map(d => d.count), 1);
  return data.map(d => `
    <div class="bar-row">
      <div class="bar-name" title="${esc(d.name)}">${esc(d.name)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round((d.count/max)*100)}%;background:${color||C.coral}"></div></div>
      <div class="bar-pct">${d.count}</div>
    </div>
  `).join("");
}

function gaugeSVG(pct){
  const r=70, cx=90, cy=90;
  const angle = (pct/100)*180;
  const toXY = (deg) => { const rad = Math.PI*(180-deg)/180; return [cx + r*Math.cos(rad), cy - r*Math.sin(rad)]; };
  const [x1,y1] = toXY(0);
  const [x2,y2] = toXY(angle);
  const large = angle > 180 ? 1 : 0;
  const color = barColor(pct);
  return `
    <svg viewBox="0 0 180 110" style="width:100%;max-width:200px;display:block;">
      <path d="M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}" fill="none" stroke="${C.areia}" stroke-width="14" stroke-linecap="round"/>
      <path d="M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2}" fill="none" stroke="${color}" stroke-width="14" stroke-linecap="round"/>
      <text x="${cx}" y="${cy-6}" text-anchor="middle" font-size="28" font-weight="800" fill="${C.dark}" font-family="Poppins, sans-serif">${pct}%</text>
      <text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="10.5" font-weight="700" fill="${C.grafite}" font-family="Poppins, sans-serif">CONFORMIDADE</text>
    </svg>
  `;
}

function kpiCard(iconName, label, value, accent){
  return `
    <div class="kpi-card">
      <div class="kpi-label" style="color:${C.muted||'#928D88'}">${ic(iconName)} ${label.toUpperCase()}</div>
      <div class="kpi-value" style="color:${accent || C.dark}">${value}</div>
    </div>
  `;
}

function trendChartHtml(monthChart){
  if(monthChart.length <= 1){
    return `<div style="height:200px;display:flex;align-items:center;justify-content:center;font-size:12.5px;color:${C.muted};text-align:center;padding:0 20px;">Registre observações em mais de um mês para ver a tendência.</div>`;
  }
  const w=320, h=190, padL=30, padR=14, padT=20, padB=28;
  const plotW = w-padL-padR, plotH = h-padT-padB;
  const stepX = monthChart.length>1 ? plotW/(monthChart.length-1) : 0;
  const yFor = (pct) => padT + (1-pct/100)*plotH;
  const pts = monthChart.map((m,i) => [padL+i*stepX, yFor(m.conformidade)]);
  const path = pts.map((p,i)=>(i===0?"M":"L")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const areaPath = path + ` L ${pts[pts.length-1][0].toFixed(1)} ${(padT+plotH).toFixed(1)} L ${pts[0][0].toFixed(1)} ${(padT+plotH).toFixed(1)} Z`;
  const gridLines = [0,50,100].map(v => `
    <line x1="${padL}" y1="${yFor(v).toFixed(1)}" x2="${w-padR}" y2="${yFor(v).toFixed(1)}" stroke="${C.border}" stroke-width="1"/>
    <text x="${padL-5}" y="${(yFor(v)+3).toFixed(1)}" text-anchor="end" font-size="8" fill="${C.muted}" font-family="Poppins, sans-serif">${v}%</text>
  `).join("");
  const dotsLabels = pts.map((p,i) => `
    <circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="${C.white}" stroke="${C.coral}" stroke-width="2"/>
    <text x="${p[0].toFixed(1)}" y="${Math.max(10,p[1]-9).toFixed(1)}" text-anchor="middle" font-size="9" font-weight="700" fill="${C.dark}" font-family="Poppins, sans-serif">${monthChart[i].conformidade}%</text>
    <text x="${p[0].toFixed(1)}" y="${h-8}" text-anchor="middle" font-size="8.5" fill="${C.grafite}" font-family="Poppins, sans-serif">${monthChart[i].mes.slice(5)}/${monthChart[i].mes.slice(2,4)}</text>
  `).join("");
  return `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:200px;">
      <defs>
        <linearGradient id="trendFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${C.coral}" stop-opacity="0.28"/>
          <stop offset="100%" stop-color="${C.coral}" stop-opacity="0"/>
        </linearGradient>
      </defs>
      ${gridLines}
      <path d="${areaPath}" fill="url(#trendFill)" stroke="none"/>
      <path d="${path}" fill="none" stroke="${C.coral}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      ${dotsLabels}
    </svg>
  `;
}

function donutSVG(data, colorFn, size){
  size = size || 170;
  const total = data.reduce((s,d) => s + d.count, 0);
  if(total === 0) return "";
  const strokeW = 22;
  const r = size/2 - strokeW/2 - 2;
  const cx = size/2, cy = size/2;
  const circumference = 2*Math.PI*r;
  let cumulative = 0;
  const arcs = data.filter(d => d.count > 0).map(d => {
    const frac = d.count/total;
    const dash = frac*circumference;
    const gap = Math.max(0, circumference-dash);
    const rotation = (cumulative/total)*360 - 90;
    cumulative += d.count;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colorFn(d.name)}" stroke-width="${strokeW}" stroke-dasharray="${dash.toFixed(1)} ${gap.toFixed(1)}" transform="rotate(${rotation.toFixed(1)} ${cx} ${cy})"/>`;
  }).join("");
  return `
    <svg viewBox="0 0 ${size} ${size}" style="width:100%;max-width:180px;display:block;margin:0 auto;">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${C.areia}" stroke-width="${strokeW}"/>
      ${arcs}
      <text x="${cx}" y="${cy-3}" text-anchor="middle" font-size="22" font-weight="800" fill="${C.dark}" font-family="Poppins, sans-serif">${total}</text>
      <text x="${cx}" y="${cy+15}" text-anchor="middle" font-size="9" font-weight="700" fill="${C.muted}" font-family="Poppins, sans-serif">OCORRÊNCIAS</text>
    </svg>
  `;
}

function donutLegend(data, colorFn, total){
  return data.filter(d => d.count > 0).map(d => `
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;padding:5px 0;border-bottom:1px solid ${C.areia};">
      <div style="display:flex;align-items:center;gap:7px;overflow:hidden;">
        <span style="width:10px;height:10px;border-radius:3px;background:${colorFn(d.name)};flex-shrink:0;"></span>
        <span style="color:${C.dark};font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(d.name)}</span>
      </div>
      <span style="font-weight:800;color:${C.grafite};flex-shrink:0;">${d.count} <span style="color:${C.muted};font-weight:600;">· ${Math.round((d.count/total)*100)}%</span></span>
    </div>
  `).join("");
}

function highlightsHtml(s){
  const tiles = [];
  if(s.piorLocal) tiles.push({icon:'map', label:'Local que mais precisa de atenção', value:s.piorLocal.loc, sub:`${s.piorLocal.conformidade}% de conformidade`, color:C.coral});
  if(s.topEmpresa) tiles.push({icon:'building', label:'Empresa mais observada', value:s.topEmpresa.name, sub:`${s.topEmpresa.count} observação(ões)`, color:C.dark});
  if(s.topObservador) tiles.push({icon:'users', label:'Observador mais atuante', value:s.topObservador.name, sub:`${s.topObservador.count} abordagem(ns)`, color:C.dark});
  if(s.topAtivador) tiles.push({icon:'sparkles', label:'Ativador mais recorrente', value:s.topAtivador.name, sub:`${s.topAtivador.count} ocorrência(s)`, color:C.amber});
  if(!tiles.length) return `<div style="text-align:center;padding:16px;font-size:12.5px;color:${C.muted}">Dados insuficientes para gerar destaques ainda.</div>`;
  return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
    ${tiles.map(t => `
      <div style="background:${C.areia};border-radius:12px;padding:12px;">
        <div style="display:flex;align-items:center;gap:6px;font-size:9.5px;font-weight:700;color:${C.muted};text-transform:uppercase;letter-spacing:.02em;margin-bottom:7px;">${ic(t.icon)} ${t.label}</div>
        <div style="font-size:14px;font-weight:800;color:${C.dark};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${esc(t.value)}">${esc(t.value)}</div>
        <div style="font-size:11px;color:${t.color};font-weight:700;margin-top:2px;">${t.sub}</div>
      </div>
    `).join("")}
  </div>`;
}

function executiveSummary(s, records){
  let trendTxt = "";
  if(s.trendDelta !== null){
    if(s.trendDelta > 0) trendTxt = `, com a conformidade subindo <b style="color:${C.verde}">${s.trendDelta} pontos</b> em relação ao mês anterior`;
    else if(s.trendDelta < 0) trendTxt = `, com a conformidade caindo <b style="color:${C.coral}">${Math.abs(s.trendDelta)} pontos</b> em relação ao mês anterior`;
    else trendTxt = `, com conformidade estável em relação ao mês anterior`;
  }
  return `Foram registradas <b>${records.length}</b> observação(ões) em <b>${s.localRanking.length}</b> local(is) distinto(s), com <b>${s.overall}%</b> de conformidade geral${trendTxt}.`;
}

        <div class="empty-sub">Registre observações na aba de campo para ver o painel.</div>
      </div>
    `;
  }

  const s = computeStats(records);

  const sectionStackedBars = s.sectionChart.map(d => {
    const total = d.total || 1;
    const simPct = Math.round((d.sim/total)*100);
    const naoPct = Math.round((d.nao/total)*100);
    const naPct = Math.max(0, 100 - simPct - naoPct);
    return `
      <div style="margin-bottom:13px;">
        <div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:4px;">
          <span style="color:${C.dark};font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${esc(d.name)}">${esc(d.name)}</span>
          <span style="font-weight:800;color:${barColor(d.conformidade)};flex-shrink:0;margin-left:8px;">${d.conformidade}%</span>
        </div>
        <div style="display:flex;height:10px;border-radius:6px;overflow:hidden;background:${C.areia};">
          ${d.sim>0 ? `<div style="width:${simPct}%;background:${C.verde};"></div>` : ""}
          ${d.nao>0 ? `<div style="width:${naoPct}%;background:${C.coral};"></div>` : ""}
          ${d.na>0 ? `<div style="width:${naPct}%;background:${C.grafite};opacity:.35;"></div>` : ""}
        </div>
      </div>
    `;
  }).join("") + `
    <div style="display:flex;gap:16px;margin-top:4px;font-size:10.5px;color:${C.grafite};">
      <span style="display:flex;align-items:center;gap:5px;"><span style="width:9px;height:9px;border-radius:2px;background:${C.verde};display:inline-block;"></span>Sim</span>
      <span style="display:flex;align-items:center;gap:5px;"><span style="width:9px;height:9px;border-radius:2px;background:${C.coral};display:inline-block;"></span>Não</span>
      <span style="display:flex;align-items:center;gap:5px;"><span style="width:9px;height:9px;border-radius:2px;background:${C.grafite};opacity:.35;display:inline-block;"></span>NA</span>
    </div>
  `;

  const trendHtml = trendChartHtml(s.monthChart);

  const rankingHtml = s.localRanking.map(l => `

      <div class="rank-loc" title="${esc(l.loc)}">${esc(l.loc)}</div>

      <div class="rank-pct">${l.conformidade}%</div>

  const naoConfHtml = s.naoConformidades.length === 0
    ? `<div style="text-align:center;padding:16px;font-size:12.5px;color:${C.muted||'#928D88'}">Nenhuma não conformidade registrada. 👍</div>`

          <div class="crit-top"><span>${esc(c.local)}</span><span>${esc(c.data)}</span></div>
          <div class="crit-text">${esc(c.item)}</div>
          ${c.ativador ? `<div class="crit-obs" style="font-style:normal;font-weight:600;">Ativador: ${esc(c.categoria)} · ${esc(c.ativador)}</div>` : `<div class="crit-obs" style="font-style:normal;font-weight:600;color:${C.coral};">Ativador não identificado</div>`}
          ${c.obs ? `<div class="crit-obs">"${esc(c.obs)}"</div>` : ""}
        </div>
      `).join("");

  const ativColors = { "Fisiológico":"#3A7BD5", "Psicológico":C.grafite, "Cognitivo":"#2A8C82", "Social":"#F2A93B", "Organizacional":C.coral };
  const ativColorFn = (name) => ativColors[name] || C.coral;
  const donut = donutSVG(s.ativadorChart, ativColorFn, 170);
  const ativDonutHtml = s.totalAtivadores === 0
    ? `<div style="text-align:center;padding:16px;font-size:12.5px;color:${C.muted}">Nenhum ativador registrado ainda nos itens marcados como "Não".</div>`
    : `

        <div style="flex-shrink:0;width:170px;">${donut}</div>
        <div style="flex:1;min-width:160px;">${donutLegend(s.ativadorChart, ativColorFn, s.totalAtivadores)}</div>
      </div>
    `;

  const coachCard = s.coachScore === null ? "" : `
    <div class="card">
      <div class="chart-title">${ic('list')} Score médio de autoavaliação · Método C.O.A.C.H.</div>
      <div style="display:flex;align-items:center;gap:14px;">
        <div style="font-size:32px;font-weight:800;color:${s.coachScore>=80?C.verde:s.coachScore>=60?C.amber:C.coral};">${s.coachScore}%</div>
        <div style="flex:1;height:10px;border-radius:6px;background:${C.areia};overflow:hidden;">
          <div style="height:100%;border-radius:6px;width:${s.coachScore}%;background:${s.coachScore>=80?C.verde:s.coachScore>=60?C.amber:C.coral};"></div>
        </div>
      </div>
      <div style="font-size:11.5px;color:${C.muted};margin-top:8px;">Média da qualidade do diálogo comportamental (Cuidado Ativo, Observação, Análise, Comunicação e Help) nas observações com autoavaliação preenchida.</div>
    </div>
  `;

  const totalAtividades = (s.atividadeCount.Rotina||0) + (s.atividadeCount.Eventual||0);
  const rotinaPct = totalAtividades ? Math.round(((s.atividadeCount.Rotina||0)/totalAtividades)*100) : 0;
  const atividadeSplitHtml = totalAtividades === 0
    ? `<div style="text-align:center;padding:16px;font-size:12.5px;color:${C.muted}">Nenhuma atividade registrada ainda.</div>`

      <div style="display:flex;height:14px;border-radius:8px;overflow:hidden;">

        <div style="width:${100-rotinaPct}%;background:${C.grafite};"></div>
      </div>
    `;

  const observadorBars = countBarsHtml(s.observadorChart, C.coral);
  const empresaBars = countBarsHtml(s.empresaChart, C.grafite);
  const highlights = highlightsHtml(s);
  const summarySentence = executiveSummary(s, records);
  const trendDeltaBadge = s.trendDelta === null ? "" : `
    <span style="display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:20px;background:${s.trendDelta>0?C.verdeSoft:s.trendDelta<0?C.coralSoft:C.areia};color:${s.trendDelta>0?'#0d7a5f':s.trendDelta<0?C.coral:C.muted};margin-left:8px;">
      ${s.trendDelta>0?'▲':s.trendDelta<0?'▼':'●'} ${Math.abs(s.trendDelta)} pts vs. mês anterior
    </span>
  `;

  return adminBanner + `
    <div class="section-group-title">Visão geral</div>
    <div class="card top-card">
      <div class="gauge-wrap">${gaugeSVG(s.overall)}</div>
      <div style="flex:1;min-width:200px;">
        <div class="kpi-row">
          ${kpiCard('list','Observações', records.length)}
          ${kpiCard('check','Respostas Sim', s.sim, C.verde)}
          ${kpiCard('x','Respostas Não', s.nao, C.coral)}
          ${kpiCard('alert','Sem ativador', s.semAtivador, s.semAtivador>0 ? C.amber : C.dark)}
        </div>
      </div>
    </div>
    <div class="card" style="font-size:12.5px;color:${C.grafite};line-height:1.6;">
      ${summarySentence}${trendDeltaBadge}
    </div>

    <div class="card">
      <div class="kpi-row">
        ${kpiCard('building','Empresas abordadas', s.empresasDistintas)}
        ${kpiCard('users','Observadores atuantes', s.observadoresDistintos)}
        ${kpiCard('check','Compromissos firmados', s.feedbacksCount, C.verde)}
        ${kpiCard('calendar','Atividades eventuais', s.atividadeCount.Eventual||0, C.amber)}
      </div>
    </div>

    <div class="section-group-title">Destaques</div>

      </div>

        <div class="chart-title">Tendência mensal de conformidade</div>
        ${trendHtml}
      </div>
    </div>

    <div class="section-group-title">Análise de risco comportamental</div>
    <div class="card">
      <div class="chart-title">${ic('sparkles')} Ativadores mais associados a comportamentos de risco</div>
      ${ativDonutHtml}
    </div>

    <div class="card">
      <div class="chart-title" style="color:${C.coral}">${ic('alert')} Não conformidades identificadas (respostas "Não")</div>
      ${naoConfHtml}
    </div>

    <div class="section-group-title">Desempenho operacional</div>
    <div class="charts-grid">
      <div class="card">
        <div class="chart-title">${ic('calendar')} Tipo de atividade observada</div>
        ${atividadeSplitHtml}
      </div>
      <div class="card">
        <div class="chart-title">${ic('users')} Abordagens por observador</div>
        ${observadorBars}
      </div>
    </div>

    <div class="card">
      <div class="chart-title">${ic('building')} Observações por empresa abordada</div>
      ${empresaBars}
    </div>

    <div class="card">
      <div class="chart-title">${ic('map')} Ranking por local (menor conformidade primeiro)</div>
      ${rankingHtml}
    </div>
  `;
}

  }
  app.innerHTML = renderShell();
  document.getElementById("content").innerHTML = state.tab === "form" ? renderForm() : renderDashboard();

  if(state.showAdminLogin){
    app.insertAdjacentHTML("beforeend", renderAdminLoginModal());
  }
  app.querySelectorAll(".coach-modal").forEach(box => box.addEventListener("click", (e) => e.stopPropagation()));
  attachListeners();
}

function attachListeners(){
  document.querySelectorAll("[data-action]").forEach(el => {
    const action = el.getAttribute("data-action");

    if(action === "export-records"){
      el.addEventListener("click", exportRecords);
    }
    if(action === "set-tab" && el.tagName === "BUTTON"){
      el.addEventListener("click", () => { state.tab = el.getAttribute("data-tab"); render(); });
    }
    if(action === "toggle-section"){
      el.addEventListener("click", () => {
        const sec = el.getAttribute("data-section");
        state.openSection = state.openSection === sec ? null : sec;
        render();
      });
    }
    if(action === "set-resposta"){
      el.addEventListener("click", () => {
        const item = el.getAttribute("data-item");
        const value = el.getAttribute("data-value");
        const prev = state.form.respostas[item] || {};
        state.form.respostas[item] = {
          ...prev, resposta: value,
          ativadorCategoria: value === "Não" ? prev.ativadorCategoria : null,
          ativador: value === "Não" ? prev.ativador : null,
        };
        render();
      });
    }
    if(action === "set-ativador-cat"){
      el.addEventListener("click", () => {
        const item = el.getAttribute("data-item");
        const value = el.getAttribute("data-value");
        const prev = state.form.respostas[item] || {};
        state.form.respostas[item] = { ...prev, ativadorCategoria: value, ativador: prev.ativadorCategoria===value ? prev.ativador : null };
        render();
      });
    }
    if(action === "set-ativador"){
      el.addEventListener("click", () => {
        const item = el.getAttribute("data-item");
        const value = el.getAttribute("data-value");
        state.form.respostas[item] = { ...(state.form.respostas[item]||{}), ativador: value };
        render();
      });
    }
    if(action === "cover-goto-form"){
      el.addEventListener("click", () => { state.showCover = false; state.tab = "form"; render(); });
    }
    if(action === "cover-goto-coach"){
      el.addEventListener("click", () => { state.showCover = false; state.tab = "form"; state.showCoachGuide = true; render(); });
    }
    if(action === "cover-goto-dashboard"){
      el.addEventListener("click", () => { state.showCover = false; state.tab = "dashboard"; render(); });
    }
    if(action === "show-cover"){
      el.addEventListener("click", () => { state.showCover = true; render(); });
    }
    if(action === "toggle-coach-guide"){
      el.addEventListener("click", () => { state.showCoachGuide = !state.showCoachGuide; render(); });
    }
    if(action === "close-coach-guide"){
      el.addEventListener("click", () => { state.showCoachGuide = false; render(); });
    }
    if(action === "generate-pdf"){
      el.addEventListener("click", () => generatePdf(state.lastSavedRecord));
    }
    if(action === "dismiss-pdf-banner"){
      el.addEventListener("click", () => { state.lastSavedRecord = null; render(); });
    }
    if(action === "sync-pending"){
      el.addEventListener("click", syncPendingRecords);
    }
    if(action === "dismiss-sync-error"){
      el.addEventListener("click", () => { state.lastSyncError = ""; render(); });
    }
    if(action === "open-admin-login"){
      el.addEventListener("click", () => { state.showAdminLogin = true; state.adminError = ""; state.adminPinInput = ""; render(); });
    }
    if(action === "close-admin-login"){
      el.addEventListener("click", () => { state.showAdminLogin = false; state.adminError = ""; render(); });
    }
    if(action === "set-admin-pin"){
      el.addEventListener("input", () => { state.adminPinInput = el.value; });
      el.addEventListener("keydown", (e) => {
        if(e.key === "Enter"){ document.querySelector('[data-action="admin-login-submit"]')?.click(); }
      });
    }
    if(action === "admin-login-submit"){
      el.addEventListener("click", async () => {
        if(state.adminPinInput.trim() !== ADMIN_PIN){
          state.adminError = "PIN incorreto.";
          render();
          return;
        }
        state.adminLoading = true; state.adminError = ""; render();
        try {
          const all = await fetchAllRecords();
          state.adminRecords = all;
          state.adminMode = true;
          state.showAdminLogin = false;
          state.adminLoading = false;
          state.tab = "dashboard";
          render();
        } catch(e){
          state.adminLoading = false;
          const detail = (e && e.message) ? e.message : String(e);
          state.adminError = `Não foi possível carregar o painel geral. Detalhe: ${detail}`;
          render();
        }
      });
    }
    if(action === "admin-exit"){
      el.addEventListener("click", () => { state.adminMode = false; state.adminRecords = []; render(); });
    }
    if(action === "clear-local"){
      el.addEventListener("click", () => {
        const ok = confirm(`Isso vai apagar as ${state.records.length} observação(ões) salvas neste aparelho.\n\nIsso NÃO afeta o Painel Geral (dados já sincronizados na nuvem continuam lá).\n\nDeseja continuar?`);
        if(!ok) return;
        localStorage.removeItem(STORAGE_KEY);
        state.records = [];
        state.lastSavedRecord = null;
        render();
        showToast("Observações locais apagadas ✓");
      });
    }
    if(action === "set-obs"){
      el.addEventListener("input", () => {
        const item = el.getAttribute("data-item");
        state.form.respostas[item] = { ...(state.form.respostas[item]||{}), obs: el.value };
      });
    }
    if(action === "set-atividade"){
      el.addEventListener("click", () => { state.form.atividadeTipo = el.getAttribute("data-value"); render(); });
    }
    if(action === "set-header"){
      const handler = () => { state.form[el.getAttribute("data-field")] = el.value; };
      el.addEventListener("input", handler);
      el.addEventListener("change", handler);
    }
    if(action === "set-feedbacks"){
      el.addEventListener("input", () => { state.form.feedbacks = el.value; });
    }
    if(action === "save-record"){
      el.addEventListener("click", () => {
        if(state.saving) return;
        const answeredCount = Object.values(state.form.respostas).filter(r => r?.resposta).length;
        if(answeredCount < ALL_ITEMS.length){
          showToast(`Faltam ${ALL_ITEMS.length - answeredCount} itens do checklist para poder salvar.`);
          return;
        }
        if(!state.form.horaTermino) state.form.horaTermino = nowHHMM();
        state.saving = true; render();
        const record = { ...state.form, ...resumoRespostas(state.form), _synced: false };
        const next = [...state.records, record];
        const ok = saveRecords(next);
        state.saving = false;
        if(ok){
          state.records = next;
          state.savedFlash = true;
          state.lastSavedRecord = record;
          if(state.form.observadores && state.form.observadores.trim()) saveName(state.form.observadores.trim());
          state.form = emptyForm();
          state.openSection = "1";
          render();
          setTimeout(() => { state.savedFlash = false; render(); }, 1800);
          // Sincroniza com o backend central em segundo plano (não bloqueia o uso local)
          syncRecord(record).then(result => {
            if(result.ok){
              record._synced = true;
              state.lastSyncError = "";
            } else {
              state.lastSyncError = result.error || "Erro desconhecido";
            }
            saveRecords(state.records);
            render();
          });
        } else {
          render();
        }
      });
    }
  });
}

render();
</script>

<!-- =========================================================================
     PWA — instalação no celular e funcionamento offline
     Bloco isolado de propósito: não depende de nada do app acima e pode ser
     removido inteiro sem afetar o funcionamento.
========================================================================= -->
<script>
(function(){
  "use strict";

  /* ------------------------------------------- 1. registrar o service worker */
  // Só funciona em HTTPS (ou localhost). Abrindo o arquivo direto do disco
  // (file://) o navegador bloqueia — é esperado, não é erro.
  var podeSW = "serviceWorker" in navigator &&
               (location.protocol === "https:" || location.hostname === "localhost");

  if (podeSW) {
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("./sw.js").catch(function(){ /* silencioso */ });
    });
  }

  /* --------------------------------------------- 2. convite de instalação */
  var jaInstalado = window.matchMedia("(display-mode: standalone)").matches ||
                    window.navigator.standalone === true;
  if (jaInstalado) return;                      // já rodando como app
  if (localStorage.getItem("oac_install_hide")) return;   // usuário dispensou

  var ehIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  var promptEvent = null;

  function montarBanner(textoBotao, aoClicar){
    var wrap = document.createElement("div");
    wrap.setAttribute("role", "dialog");
    wrap.setAttribute("aria-label", "Instalar aplicativo");
    wrap.style.cssText = [
      "position:fixed", "left:12px", "right:12px", "bottom:12px", "z-index:9999",
      "background:#FFFFFF", "border:1.5px solid #FF5246", "border-radius:14px",
      "box-shadow:0 6px 24px rgba(0,0,0,.18)", "padding:12px 14px",
      "display:flex", "align-items:center", "gap:12px",
      "font-family:'Poppins',-apple-system,Segoe UI,Roboto,sans-serif",
      "max-width:520px", "margin:0 auto"
    ].join(";");

    var icone = document.createElement("img");
    icone.src = "icon-192.png";
    icone.alt = "";
    icone.style.cssText = "width:38px;height:38px;border-radius:9px;flex:0 0 auto;";

    var txt = document.createElement("div");
    txt.style.cssText = "flex:1;min-width:0;";
    txt.innerHTML =
      '<div style="font-weight:700;font-size:13.5px;color:#2B2B2B;">Instalar o app de OAC</div>' +
      '<div style="font-size:11.5px;color:#4B4B4B;line-height:1.35;">' + textoBotao.dica + '</div>';

    var acoes = document.createElement("div");
    acoes.style.cssText = "display:flex;flex-direction:column;gap:5px;flex:0 0 auto;";

    if (textoBotao.rotulo) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = textoBotao.rotulo;
      btn.style.cssText = "border:none;border-radius:9px;background:#FF5246;color:#fff;" +
        "font-family:inherit;font-weight:700;font-size:12.5px;padding:8px 14px;cursor:pointer;";
      btn.onclick = function(){ aoClicar(wrap); };
      acoes.appendChild(btn);
    }

    var fechar = document.createElement("button");
    fechar.type = "button";
    fechar.textContent = "Agora não";
    fechar.style.cssText = "border:none;background:transparent;color:#4B4B4B;" +
      "font-family:inherit;font-size:11.5px;padding:4px;cursor:pointer;text-decoration:underline;";
    fechar.onclick = function(){
      try { localStorage.setItem("oac_install_hide", "1"); } catch(e){}
      wrap.remove();
    };
    acoes.appendChild(fechar);

    wrap.appendChild(icone);
    wrap.appendChild(txt);
    wrap.appendChild(acoes);
    document.body.appendChild(wrap);
    return wrap;
  }

  // Android / Chrome / Edge: o navegador avisa quando o app é instalável
  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault();
    promptEvent = e;
    montarBanner(
      { rotulo: "Instalar", dica: "Abre em tela cheia e funciona sem internet." },
      function(banner){
        banner.remove();
        promptEvent.prompt();
        promptEvent = null;
      }
    );
  });

  // iOS: não existe beforeinstallprompt — só instruções
  if (ehIOS) {
    window.addEventListener("load", function(){
      setTimeout(function(){
        montarBanner(
          { rotulo: null,
            dica: "Toque em <b>Compartilhar</b> e depois em <b>Adicionar à Tela de Início</b>." },
          function(){}
        );
      }, 1500);
    });
  }

  // Confirmação: some o banner se a instalação foi concluída
  window.addEventListener("appinstalled", function(){
    try { localStorage.setItem("oac_install_hide", "1"); } catch(e){}
  });
})();
</script>
